[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wids-sentinel"
version = "0.1.0"
description = "Real-Time 802.11 Wireless Intrusion Detection System (WIDS)"
readme = "README.md"
authors = [{ name = "lazorr", email = "lazarusebi111@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "scapy>=2.5.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
wids-sentinel = "wids.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
